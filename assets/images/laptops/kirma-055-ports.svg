<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
      <rect width="600" height="420" fill="#f4f1ea" />
      <rect x="40" y="60" width="520" height="80" rx="4" fill="#1e2022" stroke="#2a2c2b" stroke-width="2" />
      <text x="55" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#164e39">LATERAL IZQUIERDO — CONECTIVIDAD VERIFICADA</text>
      <!-- Puertos USB-C / Thunderbolt -->
      <rect x="70" y="95" width="22" height="10" rx="3" fill="#0f100f" stroke="#525854" />
      <text x="70" y="125" font-family="monospace" font-size="9" fill="#164e39">USB-C</text>
      <rect x="110" y="95" width="22" height="10" rx="3" fill="#0f100f" stroke="#525854" />
      <text x="110" y="125" font-family="monospace" font-size="9" fill="#164e39">TB4</text>
      <!-- HDMI -->
      <path d="M 150 93 L 175 93 L 172 107 L 153 107 Z" fill="#0f100f" stroke="#525854" />
      <text x="150" y="125" font-family="monospace" font-size="9" fill="#164e39">HDMI</text>
      <!-- USB 3.0 -->
      <rect x="200" y="92" width="28" height="12" fill="#1e3a8a" stroke="#525854" />
      <text x="200" y="125" font-family="monospace" font-size="9" fill="#164e39">USB-A</text>

      <!-- Lateral Derecho -->
      <rect x="40" y="220" width="520" height="80" rx="4" fill="#1e2022" stroke="#2a2c2b" stroke-width="2" />
      <text x="55" y="205" font-family="monospace" font-size="12" font-weight="bold" fill="#164e39">LATERAL DERECHO — RED Y EXPANSIÓN</text>
      <!-- Audio Jack -->
      <circle cx="80" cy="260" r="7" fill="#0f100f" stroke="#525854" />
      <text x="70" y="290" font-family="monospace" font-size="9" fill="#164e39">AUDIO</text>
      <!-- MicroSD -->
      <rect x="110" y="258" width="16" height="4" fill="#0f100f" />
      <text x="105" y="290" font-family="monospace" font-size="9" fill="#164e39">uSD</text>
      <!-- Ethernet RJ45 -->
      <rect x="150" y="252" width="24" height="16" rx="2" fill="#0f100f" stroke="#525854" />
      <text x="145" y="290" font-family="monospace" font-size="9" fill="#164e39">RJ-45</text>
      
      <!-- Sello de inspección -->
      <rect x="420" y="320" width="140" height="60" rx="3" fill="#ffffff" stroke="#164e39" stroke-width="1.5" />
      <text x="430" y="340" font-family="monospace" font-size="10" font-weight="bold" fill="#164e39">KIRMA CHECK</text>
      <text x="430" y="358" font-family="monospace" font-size="11" font-weight="bold" fill="#15803d">100% PUERTOS OK</text>
    </svg>